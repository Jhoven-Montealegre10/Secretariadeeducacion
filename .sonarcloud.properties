# Configuración del análisis automático de SonarQube Cloud.
# Código de pruebas: se analiza como tal (reglas de pruebas).
sonar.sources=src,scripts,public,views
sonar.tests=test
# Detección de duplicados: se excluyen solo los DATOS (migraciones con el contenido inicial del sitio y la
# lista fija de secciones del buscador), cuya forma se repite por naturaleza. Siguen analizándose por
# seguridad y confiabilidad.
sonar.cpd.exclusions=src/infrastructure/database/migrations/**,src/application/search-index.ts
