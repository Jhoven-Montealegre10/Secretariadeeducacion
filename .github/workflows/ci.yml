# Integración continua: calidad estática, pruebas unitarias y de integración contra PostgreSQL real,
# contrato OpenAPI, auditoría de dependencias y pruebas E2E en Chromium, Firefox y WebKit.
# Credenciales: solo de la base de PRUEBAS efímera del contenedor (no son secretos reales).
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: superclave-solo-pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:superclave-solo-pruebas@127.0.0.1:5432/postgres
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_NAME: semibague_ci
      DB_USER: semibague_app
      DB_PASSWORD: app-solo-pruebas-123
      DB_MIGRATION_USER: semibague_migrator
      DB_MIGRATION_PASSWORD: migrador-solo-pruebas-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cliente de PostgreSQL (psql)
        # La imagen ubuntu-24.04 ya incluye psql; solo se instala si falta (evita depender de los espejos de apt).
        run: command -v psql >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client); psql --version
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Base de CI con roles de mínimo privilegio y migraciones
        run: |
          psql "$TEST_PG_ADMIN_URL" -q -v app_password=app-solo-pruebas-123 -v migrator_password=migrador-solo-pruebas-123 \
            -v db_name=semibague_ci -f scripts/postgres/01-crear-roles-y-base.sql
          npx typeorm migration:run -d dist/src/infrastructure/database/migration-cli.js
      - name: Sin desviación entre entidades y esquema
        run: npx typeorm migration:generate -d dist/src/infrastructure/database/migration-cli.js /tmp/semibague-drift --dr --ch
      - name: Contrato OpenAPI sincronizado
        run: npm run openapi:check
      - run: npm audit --omit=dev

  e2e:
    needs: verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: superclave-solo-pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:superclave-solo-pruebas@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cliente de PostgreSQL (psql)
        run: command -v psql >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client); psql --version
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build && npx tsc -p tsconfig.json
      - run: npm run test:e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OUT: test-results/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.browser }}
          path: test-results/e2e/
          retention-days: 14
