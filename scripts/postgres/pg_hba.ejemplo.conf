# Ejemplo de pg_hba.conf para producción: solo TLS, solo desde el servidor de la aplicación, SCRAM.
# TYPE    DATABASE   USER                ADDRESS            METHOD
local     all        postgres                               peer
hostssl   semibague  semibague_app       10.0.10.15/32      scram-sha-256
hostssl   semibague  semibague_migrator  10.0.10.15/32      scram-sha-256
host      all        all                 0.0.0.0/0          reject
host      all        all                 ::/0               reject
